<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

    <!-- ================= BOOT SCREEN ================= -->
    <div id="boot-screen">
        <div class="boot-inner">
            <div class="boot-logo">
                <div class="aurora-ring"></div>
                <span class="boot-glyph">◍</span>
            </div>
            <div class="boot-name">AURORA&nbsp;<span>OS</span></div>
            <div class="boot-bar"><div id="boot-fill"></div></div>
            <div id="boot-status">Initializing kernel…</div>
        </div>
    </div>

    <!-- ================= LOGIN / LOCK SCREEN ================= -->
    <div id="login-screen" class="hidden">
        <div class="login-clockwrap">
            <div id="login-time">00:00</div>
            <div id="login-date">—</div>
        </div>
        <div class="login-card">
            <div id="login-avatar">🦊</div>
            <input id="login-name" placeholder="Your name" maxlength="18" spellcheck="false" autocomplete="off">
            <div id="avatar-row"></div>
            <button id="login-btn">Log In</button>
        </div>
        <div class="login-hint">Press&nbsp;<b>Enter</b>&nbsp;to continue</div>
    </div>

    <!-- ================= DESKTOP ================= -->
    <div id="desktop" class="hidden">
        <div id="wallpaper"></div>
        <div id="aurora-veil"></div>

        <!-- Menu bar -->
        <div id="menubar">
            <div class="mb-left">
                <button id="mb-logo" title="Aurora menu">◍</button>
                <span id="mb-appname">Files</span>
            </div>
            <div class="mb-right">
                <span id="mb-battery" class="mb-icon" title="Battery">🔋</span>
                <span id="mb-wifi" class="mb-icon" title="Network">📶</span>
                <button id="mb-spotlight" class="mb-icon" title="Search — Ctrl+K">🔍</button>
                <button id="mb-cc" class="mb-icon" title="Control Center">🎛️</button>
                <button id="mb-clock" title="Clock">—</button>
            </div>
        </div>
        <div id="mb-menu" class="hidden"></div>
        <div id="clock-pop" class="hidden"></div>

        <!-- Desktop icons -->
        <div id="desktop-icons"></div>

        <!-- Windows live here -->
        <div id="windows-layer"></div>

        <!-- Dock -->
        <div id="dock-wrap"><div id="dock"></div></div>

        <!-- Control Center -->
        <div id="control-center" class="hidden"></div>

        <!-- Spotlight -->
        <div id="spotlight" class="hidden">
            <div class="spot-card">
                <div class="spot-row"><span class="spot-mag">🔍</span><input id="spot-input" placeholder="Aurora Search" spellcheck="false" autocomplete="off"></div>
                <div id="spot-results"></div>
            </div>
        </div>

        <!-- Context menu -->
        <div id="context-menu" class="hidden"></div>

        <!-- Toast notifications -->
        <div id="toasts"></div>

        <!-- Screen overlays -->
        <div id="night-overlay" class="hidden"></div>
        <div id="brightness-overlay"></div>
        <div id="sleep-overlay" class="hidden"><div class="sleep-text">🌙 &nbsp;Sleeping — click anywhere to wake</div></div>
    </div>

    <!-- ================= POWER SCREEN ================= -->
    <div id="power-screen" class="hidden">
        <div class="power-inner">
            <div class="power-ring">⏻</div>
            <div class="power-label">Aurora OS is powered off</div>
            <button id="power-on-btn">Power On</button>
        </div>
    </div>

    <!-- Modal dialog (prompts / confirms) -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-card">
            <div id="modal-title">Title</div>
            <div id="modal-msg" class="hidden"></div>
            <input id="modal-input" class="hidden" spellcheck="false" autocomplete="off">
            <div id="modal-buttons">
                <button id="modal-cancel">Cancel</button>
                <button id="modal-ok" class="primary">OK</button>
            </div>
        </div>
    </div>

    <script src="core.js"></script>
    <script src="script.js"></script>
</body>
</html>
